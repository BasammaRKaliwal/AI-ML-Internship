<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Digit Recognizer</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #22c55e;
    --track: #334155;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: Arial, Helvetica, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .card {
    background: var(--card);
    border-radius: 16px;
    padding: 24px;
    width: 100%;
    max-width: 760px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
  }
  h1 { margin: 0 0 4px; font-size: 24px; }
  .sub { margin: 0 0 20px; color: var(--muted); font-size: 14px; }
  .layout { display: flex; gap: 24px; flex-wrap: wrap; }
  .left { flex: 0 0 auto; }
  .right { flex: 1 1 260px; min-width: 240px; }
  canvas {
    display: block;
    width: 280px;
    height: 280px;
    border-radius: 12px;
    border: 2px solid var(--track);
    background: #000;
    cursor: crosshair;
    touch-action: none;
  }
  button {
    margin-top: 12px;
    width: 100%;
    padding: 10px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: #052e16;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
  }
  button:hover { filter: brightness(1.08); }
  .result { text-align: center; margin-bottom: 14px; }
  .digit { font-size: 72px; font-weight: bold; line-height: 1; color: var(--accent); }
  .conf { color: var(--muted); font-size: 14px; margin-top: 4px; }
  .bar-row { display: flex; align-items: center; gap: 8px; margin: 5px 0; font-size: 13px; }
  .bar-label { width: 14px; text-align: right; color: var(--muted); }
  .bar-track { flex: 1; height: 10px; background: var(--track); border-radius: 5px; overflow: hidden; }
  .bar-fill { height: 100%; width: 0%; background: #64748b; transition: width 0.15s; }
  .bar-fill.top { background: var(--accent); }
  .bar-pct { width: 44px; text-align: right; color: var(--muted); }
  .tips { margin-top: 16px; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<div class="card">
  <h1>Digit Recognizer</h1>
  <p class="sub">Draw a digit (0-9) in the box. The CNN predicts it as you draw.</p>

  <div class="layout">
    <div class="left">
      <canvas id="pad" width="280" height="280"></canvas>
      <button id="clear" type="button">Clear</button>
    </div>

    <div class="right">
      <div class="result">
        <div class="digit" id="digit">?</div>
        <div class="conf" id="conf">Draw something to start</div>
      </div>
      <div id="bars"></div>
    </div>
  </div>

  <p class="tips">Tips: draw big and in the middle, use one clean stroke per line, and keep the digit upright.</p>
</div>

<script>
  var canvas = document.getElementById('pad');
  var ctx = canvas.getContext('2d');
  var digitEl = document.getElementById('digit');
  var confEl = document.getElementById('conf');
  var barsEl = document.getElementById('bars');
  var drawing = false;
  var pending = null;

  // Build the ten probability bars
  var fills = [];
  var pcts = [];
  for (var i = 0; i < 10; i++) {
    var row = document.createElement('div');
    row.className = 'bar-row';
    row.innerHTML = '<span class="bar-label">' + i + '</span>' +
      '<div class="bar-track"><div class="bar-fill"></div></div>' +
      '<span class="bar-pct">0%</span>';
    barsEl.appendChild(row);
    fills.push(row.querySelector('.bar-fill'));
    pcts.push(row.querySelector('.bar-pct'));
  }

  function resetCanvas() {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 20;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
  }

  function resetResult() {
    digitEl.textContent = '?';
    confEl.textContent = 'Draw something to start';
    for (var i = 0; i < 10; i++) {
      fills[i].style.width = '0%';
      fills[i].classList.remove('top');
      pcts[i].textContent = '0%';
    }
  }

  function position(e) {
    var rect = canvas.getBoundingClientRect();
    return {
      x: (e.clientX - rect.left) * (canvas.width / rect.width),
      y: (e.clientY - rect.top) * (canvas.height / rect.height)
    };
  }

  canvas.addEventListener('pointerdown', function (e) {
    drawing = true;
    canvas.setPointerCapture(e.pointerId);
    var p = position(e);
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    ctx.lineTo(p.x + 0.01, p.y + 0.01);  // makes a dot on a single click
    ctx.stroke();
  });

  canvas.addEventListener('pointermove', function (e) {
    if (!drawing) return;
    var p = position(e);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
    schedulePredict();
  });

  function stopDrawing() {
    if (!drawing) return;
    drawing = false;
    schedulePredict();
  }
  canvas.addEventListener('pointerup', stopDrawing);
  canvas.addEventListener('pointercancel', stopDrawing);

  // Predict shortly after drawing activity, not on every single pixel
  function schedulePredict() {
    if (pending) clearTimeout(pending);
    pending = setTimeout(predict, 120);
  }

  function predict() {
    fetch('/predict', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ image: canvas.toDataURL('image/png') })
    })
      .then(function (r) { return r.json(); })
      .then(show)
      .catch(function () {
        confEl.textContent = 'Could not reach the server. Is app.py still running?';
      });
  }

  function show(data) {
    if (data.error) {
      resetResult();
      confEl.textContent = data.error;
      return;
    }
    digitEl.textContent = data.digit;
    confEl.textContent = 'Confidence: ' + (data.confidence * 100).toFixed(1) + '%';
    for (var i = 0; i < 10; i++) {
      var pct = data.probabilities[i] * 100;
      fills[i].style.width = pct + '%';
      fills[i].classList.toggle('top', i === data.digit);
      pcts[i].textContent = pct.toFixed(1) + '%';
    }
  }

  document.getElementById('clear').addEventListener('click', function () {
    if (pending) clearTimeout(pending);
    resetCanvas();
    resetResult();
  });

  resetCanvas();
  resetResult();
</script>
</body>
</html>
